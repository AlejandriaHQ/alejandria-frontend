<ion-content [fullscreen]="true">
  <div class="login-page">
    <div class="login-blob login-blob--teal" aria-hidden="true"></div>

    <div class="login-blob login-blob--secondary" aria-hidden="true"></div>

    <div class="login-card">
      <div class="brand">
        <div class="logo-placeholder">
          <img src="assets/img/ale_icono2.jpeg" alt="Logo de Alejandría" class="logo" />
        </div>

        <h1>Alejandría</h1>

        <p>Gestión de Bibliotecas Inteligente</p>
      </div>

      <div class="welcome">
        <h2>Bienvenido</h2>
        <p>Inicia sesión para continuar</p>
      </div>

      <form class="form" novalidate [attr.aria-busy]="loading" (ngSubmit)="login()">
        <ion-item lines="none">
          <ion-icon
            slot="start"
            name="person-outline"
            class="input-icon"
            aria-hidden="true"
          ></ion-icon>

          <ion-input
            id="identifier"
            name="identifier"
            label="Identificador"
            labelPlacement="floating"
            type="text"
            placeholder="Correo o código de miembro"
            [(ngModel)]="identifier"
            required
            autocomplete="username"
            enterkeyhint="next"
            aria-label="Identificador"
            aria-describedby="login-error"
            [class.ion-invalid]="!!error"
            [class.ion-touched]="!!error"
          >
          </ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-icon
            slot="start"
            name="lock-closed-outline"
            class="input-icon"
            aria-hidden="true"
          ></ion-icon>

          <ion-input
            id="password"
            name="password"
            label="Contraseña"
            labelPlacement="floating"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            enterkeyhint="go"
            aria-label="Contraseña"
            aria-describedby="login-error"
            [class.ion-invalid]="!!error"
            [class.ion-touched]="!!error"
          >
          </ion-input>

          <ion-button
            slot="end"
            type="button"
            fill="clear"
            class="visibility-toggle"
            (click)="togglePasswordVisibility()"
            aria-controls="password"
          >
            <ion-icon
              slot="icon-only"
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              aria-hidden="true"
            >
            </ion-icon>
            <span class="sr-only">{{ showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña' }}</span>
          </ion-button>
        </ion-item>

        <div id="login-error" class="login-error" role="alert" aria-live="assertive" *ngIf="error">
          <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
          <span>{{ error }}</span>
        </div>

        <ion-button
          expand="block"
          type="submit"
          color="primary"
          class="login-button"
          [disabled]="loading"
        >
          <ion-spinner name="crescent" *ngIf="loading"> </ion-spinner>

          <span>{{ loading ? 'Iniciando sesión' : 'Iniciar sesión' }}</span>
        </ion-button>
      </form>

      <ion-button
        fill="clear"
        class="forgot-button"
        routerLink="/autenticacion/recuperar-contrasena"
      >
        ¿Olvidaste tu contraseña?
      </ion-button>
    </div>
  </div>
</ion-content>
