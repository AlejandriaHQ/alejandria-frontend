<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        *ngIf="showBack"
        [defaultHref]="backRoute"
        aria-label="Volver"
      ></ion-back-button>

      <img class="header-logo" src="assets/img/ale_icono2.jpeg" alt="Logo de Alejandría" />
    </ion-buttons>

    <ion-title>{{ title }}</ion-title>

    <ion-button
      slot="end"
      fill="clear"
      class="theme-toggle"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.isDark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      <ion-icon
        slot="icon-only"
        [name]="themeService.isDark ? 'sunny-outline' : 'moon-outline'"
      ></ion-icon>
    </ion-button>

    <div slot="end" class="header-user" *ngIf="currentUser">
      <div class="header-user-avatar" aria-hidden="true">{{ initial }}</div>

      <div class="header-user-info">
        <strong>{{ userName }}</strong>
        <span>{{ currentUser.identifier }}</span>
      </div>
    </div>

    <ng-content select="[slot='end']"></ng-content>
  </ion-toolbar>
</ion-header>
