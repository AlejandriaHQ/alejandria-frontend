<app-page-header title="Recuperar contraseña" backRoute="/autenticacion"></app-page-header>

<ion-content [fullscreen]="true">
  <div class="recovery-page">
    <div class="recovery-card">
      <div class="brand">
        <img src="assets/img/ale_icono.png" alt="Logo de Alejandría" class="logo" />

        <h1>Alejandría</h1>

        <p>Gestión de Bibliotecas Inteligente</p>
      </div>

      <div class="welcome">
        <h2>Restablecer contraseña</h2>

        <p>Solicita al administrador el restablecimiento de tu contraseña.</p>
      </div>

      <ion-button
        expand="block"
        fill="outline"
        color="primary"
        class="back-button"
        routerLink="/autenticacion"
      >
        Volver al inicio de sesión
      </ion-button>
    </div>
  </div>
</ion-content>
